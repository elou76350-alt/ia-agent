name: cap

services:
  app:
    build: .
    image: cap-personal-assistant:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      CAP_AUTH_ENABLED: "1"
      CAP_DATA_DIR: /data
      APP_ORIGIN: https://${CAP_DOMAIN:?Renseignez CAP_DOMAIN dans .env.host}
      CAP_SETUP_CODE: ${CAP_SETUP_CODE:-}
      AGENT_API_KEY: ${AGENT_API_KEY:?Renseignez AGENT_API_KEY dans .env.host}
      AGENT_MODEL: ${AGENT_MODEL:-gpt-5.4}
      AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT:-high}
    expose:
      - "3001"
    volumes:
      - app_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      CAP_DOMAIN: ${CAP_DOMAIN:?Renseignez CAP_DOMAIN dans .env.host}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  app_data:
  caddy_data:
  caddy_config:
